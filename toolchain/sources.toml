# Canonical machine-readable identity of the vendored normative source.
#
# These are the OASIS Standard artifacts for AMQP 1.0 core, published 29 October
# 2012. The copies under `spec/oasis/` are byte-identical to these files, are
# committed, and are never edited: the clause ledger (§6), the generated
# definition tables (§7) and every vector citation depend on their bytes.
#
# `scripts/fetch-oasis.sh --verify` re-checks the committed copies against these
# hashes offline; without `--verify` it fetches missing artifacts from
# `base_url` and refuses to proceed on any mismatch.

schema_version = 1
standard = "OASIS Advanced Message Queuing Protocol (AMQP) Version 1.0"
status = "OASIS Standard"
published = "2012-10-29"
base_url = "https://docs.oasis-open.org/amqp/core/v1.0/os"

